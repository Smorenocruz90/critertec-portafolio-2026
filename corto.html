<!doctype html>
<html lang="es" data-theme="dark">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<script>
  // Celular acostado: la página se dibuja como una pantalla de escritorio de 640 px de alto
  // (el ancho sale de la proporción de la pantalla) y el navegador la reduce para llenarla. Así
  // se ve el mismo diseño que en un computador, sin láminas apiladas. En vertical se pide girar el
  // celular (#girar en portafolio.css) y se vuelve al ancho del dispositivo.
  (function () {
    var vp = document.querySelector('meta[name="viewport"]');
    function ajusta() {
      var largo = Math.max(screen.width, screen.height), corto = Math.min(screen.width, screen.height);
      var acostado = (screen.orientation ? screen.orientation.type.indexOf('landscape') === 0 : innerWidth > innerHeight);
      vp.setAttribute('content', acostado && corto < 600
        ? 'width=' + Math.round(640 * largo / corto) + ',user-scalable=no'
        : 'width=device-width,initial-scale=1');
    }
    ajusta();
    if (screen.orientation) screen.orientation.addEventListener('change', ajusta);
    addEventListener('orientationchange', function () { setTimeout(ajusta, 60); });
  })();
</script>
<title>Critertec · Portafolio 2026 · versión corta</title>
<meta name="description" content="Portafolio 2026 de Critertec Educación en doce láminas: quiénes somos, dónde trabajamos, alianzas oficiales, proyectos insignia y prensa.">

<!--
  Portafolio Critertec 2026 · versión corta.

  Doce láminas: la que se manda en frío a un cliente nuevo o se presenta en diez minutos.
  Sale del mismo contenido.js que la larga (index.html); lo único que cambia es el PLAN.

  Dos láminas existen solo aquí, porque la corta no tiene sitio para desplegarlas:
    · «insignia» — los seis proyectos marcados `insignia: true` en una sola rejilla.
    · «palmares» — premios de la compañía y reconocimientos del CEO juntos.
-->
